# Prod-nah: App per Volume-Mount + Watch. Nutzung: docker compose up
# Caddy leitet auf app:8080; Backend-Code wird live neu geladen.
# Dev: Host-Ports nur Loopback; kein Autostart nach Reboot (restart: "no").
services:
  postgres:
    restart: 'no'
    ports:
      - '127.0.0.1:5432:5432'

  minio:
    restart: 'no'

  app:
    restart: 'no'
    build:
      context: .
      dockerfile: docker/Dockerfile.node-dev
    image: docsops-node-dev
    user: '${UID:-1000}:${GID:-1000}'
    working_dir: /app
    entrypoint: []
    volumes:
      - .:/app
    # If workspace state is stale (e.g. interrupted install), plain `pnpm install`
    # can report "Already up to date" while backend bins like tsx are missing.
    command: sh -c "pnpm install --prod=false && if [ ! -x apps/backend/node_modules/.bin/tsx ]; then pnpm install --prod=false --force; fi && pnpm --filter backend run wait-for-database && pnpm --filter backend exec prisma migrate deploy && (pnpm --filter backend run create-admin || true) && pnpm --filter backend run dev"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      CI: 'true'
      NODE_ENV: development
      PORT: 8080
      DATABASE_URL: postgresql://app:app@postgres:5432/docsops
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-docsops}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-docsopsdev}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_NAME: ${ADMIN_NAME:-}
      ADMIN_VORNAME: ${ADMIN_VORNAME:-}
      ADMIN_NACHNAME: ${ADMIN_NACHNAME:-}
      SESSION_SECRET: ${SESSION_SECRET:-}
      BACKUP_ENCRYPTION_KEY: ${BACKUP_ENCRYPTION_KEY:-}
      BACKUP_RETENTION_COUNT: ${BACKUP_RETENTION_COUNT:-}
      BACKUP_BOOTSTRAP_S3_DESTINATION: ${BACKUP_BOOTSTRAP_S3_DESTINATION:-true}
      BACKUP_ALLOW_INSECURE_S3_DESTINATIONS: ${BACKUP_ALLOW_INSECURE_S3_DESTINATIONS:-true}
      BACKUP_S3_DESTINATION_NAME: ${BACKUP_S3_DESTINATION_NAME:-Dev offsite (MinIO)}
      BACKUP_S3_DESTINATION_BUCKET: ${BACKUP_S3_DESTINATION_BUCKET:-docsops-backups}
      BACKUP_S3_DESTINATION_ENDPOINT: ${BACKUP_S3_DESTINATION_ENDPOINT:-}
      BACKUP_S3_DESTINATION_ACCESS_KEY: ${BACKUP_S3_DESTINATION_ACCESS_KEY:-}
      BACKUP_S3_DESTINATION_SECRET_KEY: ${BACKUP_S3_DESTINATION_SECRET_KEY:-}
      BACKUP_S3_DESTINATION_REGION: ${BACKUP_S3_DESTINATION_REGION:-}
      BACKUP_S3_DESTINATION_BASE_PATH: ${BACKUP_S3_DESTINATION_BASE_PATH:-}
      LOG_HTTP_REQUESTS: ${LOG_HTTP_REQUESTS:-false}
      DOCSOPS_UPDATE_GITHUB_REPO: ${DOCSOPS_UPDATE_GITHUB_REPO:-bjkawecki/docs-ops}
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O - http://127.0.0.1:8080/ready || exit 1']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 120s

  docsops-job-worker:
    restart: 'no'
    build:
      context: .
      dockerfile: docker/Dockerfile.node-dev
    image: docsops-node-dev
    user: '${UID:-1000}:${GID:-1000}'
    working_dir: /app
    entrypoint: []
    volumes:
      - .:/app
    command: sh -c "pnpm --filter backend run wait-for-database && pnpm --filter backend run worker:dev"
    depends_on:
      postgres:
        condition: service_healthy
      app:
        condition: service_healthy
    environment:
      CI: 'true'
      NODE_ENV: development
      DATABASE_URL: postgresql://app:app@postgres:5432/docsops
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-docsops}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-docsopsdev}
      SESSION_SECRET: ${SESSION_SECRET:-}
      BACKUP_ENCRYPTION_KEY: ${BACKUP_ENCRYPTION_KEY:-}
      BACKUP_RETENTION_COUNT: ${BACKUP_RETENTION_COUNT:-}
      BACKUP_BOOTSTRAP_S3_DESTINATION: ${BACKUP_BOOTSTRAP_S3_DESTINATION:-true}
      BACKUP_ALLOW_INSECURE_S3_DESTINATIONS: ${BACKUP_ALLOW_INSECURE_S3_DESTINATIONS:-true}
      BACKUP_S3_DESTINATION_NAME: ${BACKUP_S3_DESTINATION_NAME:-Dev offsite (MinIO)}
      BACKUP_S3_DESTINATION_BUCKET: ${BACKUP_S3_DESTINATION_BUCKET:-docsops-backups}
      BACKUP_S3_DESTINATION_ENDPOINT: ${BACKUP_S3_DESTINATION_ENDPOINT:-}
      BACKUP_S3_DESTINATION_ACCESS_KEY: ${BACKUP_S3_DESTINATION_ACCESS_KEY:-}
      BACKUP_S3_DESTINATION_SECRET_KEY: ${BACKUP_S3_DESTINATION_SECRET_KEY:-}
      BACKUP_S3_DESTINATION_REGION: ${BACKUP_S3_DESTINATION_REGION:-}
      BACKUP_S3_DESTINATION_BASE_PATH: ${BACKUP_S3_DESTINATION_BASE_PATH:-}
      TYPST_BIN: ${TYPST_BIN:-}
      TYPST_ARGS: ${TYPST_ARGS:-}
      DOCSOPS_UPDATE_GITHUB_REPO: ${DOCSOPS_UPDATE_GITHUB_REPO:-bjkawecki/docs-ops}

  frontend:
    container_name: ${COMPOSE_PROJECT_NAME:-docsops}-frontend
    build:
      context: .
      dockerfile: docker/Dockerfile.node-dev
    image: docsops-node-dev
    restart: 'no'
    user: '${UID:-1000}:${GID:-1000}'
    working_dir: /app
    ports:
      - '127.0.0.1:5173:5173'
    depends_on:
      app:
        condition: service_healthy
    environment:
      VITE_DEV_PROXY_API: http://app:8080
      # Listen inside the container so Caddy can reach frontend:5173; host bind is loopback-only.
      VITE_DEV_SERVER_HOST: '0.0.0.0'
    volumes:
      - .:/app
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O - http://127.0.0.1:5173/ || exit 1']
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 120s
    command: sh -c "pnpm install --prod=false --ignore-scripts && pnpm --filter frontend run dev"

  caddy:
    container_name: ${COMPOSE_PROJECT_NAME:-docsops}-caddy
    image: caddy:2-alpine
    restart: 'no'
    ports:
      - '127.0.0.1:5000:80'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      app:
        condition: service_healthy
      frontend:
        condition: service_healthy

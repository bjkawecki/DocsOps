# Schnell-Dev: nur PostgreSQL + MinIO. Backend/Frontend auf dem Host.
# Nutzung: docker compose -f docker-compose.dev.yml up -d
# Host-Ports nur auf Loopback; kein Autostart nach Reboot (restart: "no").
name: ${COMPOSE_PROJECT_NAME:-docsops}

services:
  postgres:
    container_name: ${COMPOSE_PROJECT_NAME:-docsops}-postgres
    image: postgres:18-alpine
    restart: 'no'
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: docsops
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U app -d docsops']
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    container_name: ${COMPOSE_PROJECT_NAME:-docsops}-minio
    image: minio/minio:latest
    restart: 'no'
    command: server /data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-docsops}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-docsopsdev}
    ports:
      - '127.0.0.1:9000:9000'
      - '127.0.0.1:9001:9001'
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  minio_data:
